server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  payment:
    bank-transfer:
      account-name: "${SPORTIFY_PAYMENT_ACCOUNT_NAME:Sportify Sports Center}"
      account-number: "${SPORTIFY_PAYMENT_ACCOUNT_NUMBER:0000 1041 2460}"
      bank: "${SPORTIFY_PAYMENT_BANK:Demo Bank}"
      live-instructions-enabled: ${SPORTIFY_PAYMENT_LIVE_INSTRUCTIONS_ENABLED:false}
      bank-bin: ${SPORTIFY_PAYMENT_BANK_BIN:}
    vietqr:
      local-callback-fallback: ${VIETQR_LOCAL_CALLBACK_FALLBACK:true}

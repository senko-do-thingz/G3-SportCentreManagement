server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: G3-SportCentreManagement

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sportify;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  servlet:
    multipart:
      # Coach photos are resized in the browser; the service also rejects files above 2 MB.
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/identity,classpath:db/migration/catalog
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 900000
      refresh-token:
        expiration: 604800000

app:
  training:
    ai-drills:
      # Flow 5: AI drafts Coach drill suggestions from AiDrillPolicy.safeContext (allowlisted codes, counts, scores).
      # OFF by default and in CI; a key alone never enables it. CODEOWNER-approved provider: Google Gemini, the only
      # implementation (GeminiDrillGenerator, GEMINI_API_KEY). Any other provider value activates no generator, and
      # every failure falls back to the rule-based catalog; there is no fallback to another AI provider.
      enabled: ${AI_DRILLS_ENABLED:false}
      provider: ${AI_DRILLS_PROVIDER:gemini}
      gemini-model: ${AI_DRILLS_GEMINI_MODEL:gemini-3.5-flash-lite}
      timeout-seconds: ${AI_DRILLS_TIMEOUT_SECONDS:30}
    attendance-backfill:
      # Activation and a positive ISO-8601 duration both require an approved operational cutoff.
      enabled: ${ATTENDANCE_BACKFILL_ENABLED:false}
      window: ${ATTENDANCE_BACKFILL_WINDOW:}
  assistant:
    ai:
      # Flow 6: AI works out what a Member's assistant question asks (English or Vietnamese). Answers still come
      # only from center data. Off by default; any failure uses the keyword rules. Only the question text, with
      # e-mail addresses and phone numbers removed, is sent. Private and health questions are never sent.
      enabled: ${AI_ASSISTANT_ENABLED:false}
      # gemini (GEMINI_API_KEY, default) or claude (ANTHROPIC_API_KEY). Provider and model need CODEOWNER approval.
      provider: ${AI_ASSISTANT_PROVIDER:gemini}
      model: ${AI_ASSISTANT_MODEL:claude-opus-5-5}
      gemini-model: ${AI_ASSISTANT_GEMINI_MODEL:gemini-flash-lite-latest}
      reply:
        # With AI on and provider gemini, Gemini also writes the chat reply from the center data the rules found
        # (question text with e-mails and phone numbers removed, plus the open chat history). Private and health
        # questions are still answered by the guard and never sent. Set false to keep only intent classification.
        enabled: ${AI_ASSISTANT_REPLY_ENABLED:true}
        gemini-model: ${AI_ASSISTANT_REPLY_GEMINI_MODEL:${AI_ASSISTANT_GEMINI_MODEL:gemini-flash-lite-latest}}
      timeout-seconds: ${AI_ASSISTANT_TIMEOUT_SECONDS:15}
  cors:
    # Comma separated list of origins allowed to call the API from a browser.
    # Empty means no cross-origin request is accepted. Overridden per profile.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  payment:
    unified-demo:
      enabled: ${PAYMENT_UNIFIED_DEMO_ENABLED:false}
      test-enabled: ${PAYMENT_UNIFIED_DEMO_TEST_ENABLED:false}
      member-ids: ${PAYMENT_UNIFIED_DEMO_MEMBER_IDS:}
    local-demo:
      enabled: ${PAYMENT_LOCAL_DEMO_ENABLED:false}
    simulator:
      # QR-04 is intent-only. Also requires the isolated qr-simulator profile; QR-05 owns settlement.
      enabled: ${PAYMENT_SIMULATOR_ENABLED:false}
      public-base-url: ${PAYMENT_SIMULATOR_PUBLIC_BASE_URL:}
      allowed-origins: ${PAYMENT_SIMULATOR_ALLOWED_ORIGINS:}
      lifetime-seconds: ${PAYMENT_SIMULATOR_LIFETIME_SECONDS:300}
    bank-transfer:
      live-instructions-enabled: ${SPORTIFY_PAYMENT_LIVE_INSTRUCTIONS_ENABLED:false}
      bank-bin: ${SPORTIFY_PAYMENT_BANK_BIN:}
      bank-directory: ${SPORTIFY_PAYMENT_BANK_DIRECTORY:classpath:payment/vietqr-banks.json}
      account-name: ${SPORTIFY_PAYMENT_ACCOUNT_NAME}
      account-number: ${SPORTIFY_PAYMENT_ACCOUNT_NUMBER}
      bank: ${SPORTIFY_PAYMENT_BANK}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


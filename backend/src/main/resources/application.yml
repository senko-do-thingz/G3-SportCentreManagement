server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: G3-SportCentreManagement

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sportify;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  servlet:
    multipart:
      # Coach photos are resized in the browser; the service also rejects files above 2 MB.
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/identity,classpath:db/migration/catalog
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 900000
      refresh-token:
        expiration: 604800000

app:
  training:
    attendance-backfill:
      # Activation and a positive ISO-8601 duration both require an approved operational cutoff.
      enabled: ${ATTENDANCE_BACKFILL_ENABLED:false}
      window: ${ATTENDANCE_BACKFILL_WINDOW:}
  cors:
    # Comma separated list of origins allowed to call the API from a browser.
    # Empty means no cross-origin request is accepted. Overridden per profile.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  payment:
    unified-demo:
      enabled: ${PAYMENT_UNIFIED_DEMO_ENABLED:false}
      test-enabled: ${PAYMENT_UNIFIED_DEMO_TEST_ENABLED:false}
      member-ids: ${PAYMENT_UNIFIED_DEMO_MEMBER_IDS:}
    local-demo:
      enabled: ${PAYMENT_LOCAL_DEMO_ENABLED:false}
    simulator:
      # QR-04 is intent-only. Also requires the isolated qr-simulator profile; QR-05 owns settlement.
      enabled: ${PAYMENT_SIMULATOR_ENABLED:false}
      public-base-url: ${PAYMENT_SIMULATOR_PUBLIC_BASE_URL:}
      allowed-origins: ${PAYMENT_SIMULATOR_ALLOWED_ORIGINS:}
      lifetime-seconds: ${PAYMENT_SIMULATOR_LIFETIME_SECONDS:300}
    bank-transfer:
      account-name: ${SPORTIFY_PAYMENT_ACCOUNT_NAME}
      account-number: ${SPORTIFY_PAYMENT_ACCOUNT_NUMBER}
      bank: ${SPORTIFY_PAYMENT_BANK}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


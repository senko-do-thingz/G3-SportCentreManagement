server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: G3-SportCentreManagement

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sportify;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/identity,classpath:db/migration/catalog

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 900000
      refresh-token:
        expiration: 604800000

app:
  cors:
    # Comma separated list of origins allowed to call the API from a browser.
    # Empty means no cross-origin request is accepted. Overridden per profile.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

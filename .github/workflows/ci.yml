name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_call:
    inputs:
      cash_profile:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cash_profile:
        description: Collect opt-in cash fixture timings and SQL plans
        type: boolean
        default: false

# Old reruns cannot cancel a newer PR HEAD. Authoritative runs never share a queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

defaults:
  run:
    shell: bash

jobs:
  impact:
    name: Change impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      compose: ${{ steps.classify.outputs.compose }}
      policy: ${{ steps.classify.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify immutable PR merge-base diff
        id: classify
        run: python3 scripts/ci/impact.py
      - name: Publish impact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: change-impact
          path: impact.json
          if-no-files-found: error
          retention-days: 14

  conventions:
    name: Project conventions and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check forbidden characters in added lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/check-conventions.sh "$BASE_SHA"
      - name: Test CI selectors, gates and infrastructure negative controls
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Lint GitHub workflows
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz' | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz actionlint
          ./actionlint -color

  migration-guard:
    name: Flyway migration guard
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.backend == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Guard immutable migrations and version ordering
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git merge-base origin/main HEAD)"
            if [[ "$base" == "$(git rev-parse HEAD)" ]]; then
              base="$(git rev-parse HEAD^1)"
            fi
          fi
          bash scripts/ci/check-migrations.sh "$base"

  unit-tests:
    name: Unit tests (no Docker)
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.backend == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    env:
      DOCKER_HOST: unix:///nonexistent.sock
      JWT_SECRET: "dGhpcy1pcy1hLXZlcnktc2VjcmV0LW1vY2stc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LWdoYWN0aW9ucw=="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run unit tests
        working-directory: backend
        run: mvn -B -ntp test
      - name: Fail on skipped tests
        if: always()
        run: bash scripts/ci/check-no-skipped-tests.sh backend/target/surefire-reports
      - name: Verify unit isolation and test totals
        if: always()
        run: python3 scripts/ci/check-test-reports.py unit backend/target/surefire-reports
      - name: Summarize unit counts and slow suites
        if: always()
        run: python3 scripts/ci/test_summary.py backend/target/surefire-reports 'Backend unit tests'
      - name: Publish test report
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: Unit test report
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports-unit
          path: backend/target/surefire-reports
          if-no-files-found: error
          retention-days: 14

  integration-tests:
    name: Integration tests (Testcontainers, SQL Server 2022)
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.backend == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    env:
      JWT_SECRET: "dGhpcy1pcy1hLXZlcnktc2VjcmV0LW1vY2stc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LWdoYWN0aW9ucw=="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Pre-pull SQL Server image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest
      - name: Run full SQL integration tests and package
        working-directory: backend
        env:
          CASH_PROFILE: ${{ inputs.cash_profile || false }}
        run: mvn -B -ntp verify -DskipUnitTests=true "-Dci.cash.profile=$CASH_PROFILE"
      - name: Verify executed integration suites and counts
        if: always()
        run: python3 scripts/ci/check-test-reports.py integration backend/target/failsafe-reports
      - name: Fail on skipped tests
        if: always()
        run: bash scripts/ci/check-no-skipped-tests.sh backend/target/failsafe-reports
      - name: Summarize integration counts and slow suites
        if: always()
        run: python3 scripts/ci/test_summary.py backend/target/failsafe-reports 'SQL integration tests'
      - name: Publish test report
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: backend/target/failsafe-reports/TEST-*.xml
          check_name: Integration test report
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failsafe-reports-integration
          path: backend/target/failsafe-reports
          if-no-files-found: error
          retention-days: 14
      - name: Upload fixture timing and SQL plans
        if: always() && inputs.cash_profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cash-fixture-profile
          path: backend/target/cash-profile
          if-no-files-found: error
          retention-days: 14
      - name: Bind verified integration jar to this source
        working-directory: backend/target
        run: |
          mkdir ci-package
          cp ./*.jar ci-package/
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > ci-package/source-sha.txt
          cd ci-package
          sha256sum ./*.jar source-sha.txt | sed 's#  ./#  #' > SHA256SUMS
      - name: Upload same-run backend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-build
          path: backend/target/ci-package
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package application
    needs: [impact, unit-tests, integration-tests]
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-build
          path: backend-package
      - name: Verify source and checksums without rebuilding
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/ci/verify_package.py backend-package "$EXPECTED_SHA"
      - name: Upload validated jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar
          path: backend-package
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend checks and build
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.frontend == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend test and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-reports
          path: frontend/vitest-results.json
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security
    needs: impact
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      backend: ${{ needs.impact.result != 'success' || needs.impact.outputs.backend == 'true' }}
      frontend: ${{ needs.impact.result != 'success' || needs.impact.outputs.frontend == 'true' }}

  compose-smoke:
    name: Compose smoke
    needs: impact
    if: ${{ !cancelled() && (needs.impact.result != 'success' || needs.impact.outputs.compose == 'true') }}
    uses: ./.github/workflows/compose-smoke-test.yml
    permissions:
      contents: read

  ci-gate:
    name: CI gate
    if: always()
    needs: [impact, conventions, migration-guard, unit-tests, integration-tests, package, frontend, security, compose-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject failures, cancellations, missing checks and unexpected skips
        env:
          POLICY_JSON: ${{ needs.impact.outputs.policy }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/gate.py
      - name: Reject workflow cancellation
        if: cancelled()
        run: exit 1

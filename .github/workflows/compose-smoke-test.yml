name: Compose Smoke Test

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/compose-smoke-test.yml"
  push:
    branches: ["main"]
    paths:
      - "deploy/**"
      - ".github/workflows/compose-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compose-smoke-test:
    name: Compose template smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE_TAG: "test-smoke"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert compose config requires IMAGE_TAG
        run: |
          echo "Testing that compose config fails when IMAGE_TAG is missing..."
          cp deploy/.env.example deploy/.env
          sed -i 's/<REPLACE_WITH_STRONG_SA_PASSWORD>/TestPass1234!StrongSA/g' deploy/.env
          sed -i 's/<REPLACE_WITH_BASE64_SECRET_MIN_32_BYTES>/dGhpcy1pcy1hLXZlcnktc2VjdXJlLW1vY2stc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LWdoYWN0aW9ucw==/g' deploy/.env
          if env -u IMAGE_TAG docker compose -f deploy/compose.yaml config >/dev/null 2>&1; then
            echo "Error: docker compose config unexpectedly succeeded without IMAGE_TAG"
            rm -f deploy/.env
            exit 1
          fi
          echo "Verified: docker compose config fails when IMAGE_TAG is not provided"
          rm -f deploy/.env

      - name: Create temporary test .env
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/<REPLACE_WITH_STRONG_SA_PASSWORD>/TestPass1234!StrongSA/g' deploy/.env
          sed -i 's/<REPLACE_WITH_BASE64_SECRET_MIN_32_BYTES>/dGhpcy1pcy1hLXZlcnktc2VjdXJlLW1vY2stc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LWdoYWN0aW9ucw==/g' deploy/.env

      - name: Start sqlserver service and wait for healthcheck
        run: |
          docker compose -f deploy/compose.yaml --profile with-db up -d --wait sqlserver

      - name: Run db-init service
        run: |
          docker compose -f deploy/compose.yaml --profile with-db up --exit-code-from db-init db-init

      - name: Assert database sportify exists and sa login succeeds
        run: |
          echo "Verifying database sportify exists via sys.databases..."
          docker compose -f deploy/compose.yaml --profile with-db exec -T sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -C -b -U sa -P "TestPass1234!StrongSA" -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'sportify') THROW 50000, 'Database sportify does not exist', 1;"

          echo "Verifying sa login and DB_NAME() against database sportify..."
          DB_NAME="$(docker compose -f deploy/compose.yaml --profile with-db exec -T sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -C -b -U sa -P "TestPass1234!StrongSA" -d sportify -h -1 -W -Q "SET NOCOUNT ON; SELECT DB_NAME();" | head -n 1 | tr -d '\r\n ')"
          if [ "$DB_NAME" != "sportify" ]; then
            echo "Error: Expected DB_NAME to be 'sportify', got '$DB_NAME'"
            exit 1
          fi
          echo "Verified: DB_NAME() returned '$DB_NAME'"

      - name: Assert port 1433 is not published on host
        run: |
          PUBLISHED_PORT="$(docker compose -f deploy/compose.yaml --profile with-db port sqlserver 1433 2>/dev/null || true)"
          if [ -n "$PUBLISHED_PORT" ]; then
            echo "Error: Port 1433 is published on host: $PUBLISHED_PORT"
            exit 1
          fi
          echo "Verified: Port 1433 is not published on the host"

      - name: Assert db-init idempotency by running a second time
        run: |
          docker compose -f deploy/compose.yaml --profile with-db up --force-recreate --exit-code-from db-init db-init

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml --profile with-db logs

      - name: Cleanup compose stack
        if: always()
        run: |
          docker compose -f deploy/compose.yaml --profile with-db down -v || true
          rm -f deploy/.env

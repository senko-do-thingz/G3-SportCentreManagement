name: Compose Smoke Test

on:
  pull_request:
    paths:
      - "deploy/**"
      - "backend/Dockerfile"
      - "backend/src/main/resources/**"
      - ".github/workflows/compose-smoke-test.yml"
  push:
    branches: ["main"]
    paths:
      - "deploy/**"
      - "backend/Dockerfile"
      - "backend/src/main/resources/**"
      - ".github/workflows/compose-smoke-test.yml"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compose-smoke-test:
    name: Compose template smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE_TAG: "ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert compose config requires IMAGE_TAG
        run: |
          echo "Testing that compose config fails when IMAGE_TAG is missing..."
          cp deploy/.env.example deploy/.env
          sed -i 's/<REPLACE_WITH_STRONG_SA_PASSWORD>/TestPass1234!StrongSA/g' deploy/.env
          sed -i 's/<REPLACE_WITH_BASE64_SECRET_MIN_32_BYTES>/dGhpcy1pcy1hLXZlcnktc2VjdXJlLW1vY2stc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LWdoYWN0aW9ucw==/g' deploy/.env
          if env -u IMAGE_TAG docker compose -f deploy/compose.yaml config >/dev/null 2>&1; then
            echo "Error: docker compose config unexpectedly succeeded without IMAGE_TAG"
            rm -f deploy/.env
            exit 1
          fi
          echo "Verified: docker compose config fails when IMAGE_TAG is not provided"
          rm -f deploy/.env

      - name: Assert password policy violation makes sqlserver exit
        run: |
          echo "Testing that invalid password policy causes sqlserver to exit with policy message..."
          OUTPUT="$(timeout 30s docker run --rm -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=weak mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04 2>&1 || true)"
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "password policy"; then
            echo "Verified: sqlserver failed startup due to password policy requirements as expected"
          else
            echo "Error: Expected password policy message in sqlserver output, but was not found"
            exit 1
          fi

      - name: Create temporary test .env
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/<REPLACE_WITH_STRONG_SA_PASSWORD>/TestPass1234!StrongSA/g' deploy/.env
          sed -i 's/<REPLACE_WITH_BASE64_SECRET_MIN_32_BYTES>/dGhpcy1pcy1hLXZlcnktc2VjdXJlLW1vY2stc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LWdoYWN0aW9ucw==/g' deploy/.env

      - name: Build backend container image
        run: |
          echo "Building backend container image tagged as ghcr.io/senko-do-thingz/g3-sportcentremanagement/backend:ci..."
          docker build -t ghcr.io/senko-do-thingz/g3-sportcentremanagement/backend:ci backend
          echo "Verified: Backend image built successfully"

      - name: Start sqlserver service and wait for healthcheck
        run: |
          docker compose -f deploy/compose.yaml --profile with-db up -d --wait sqlserver

      - name: Run db-init service
        run: |
          docker compose -f deploy/compose.yaml --profile with-db up --exit-code-from db-init db-init

      - name: Assert database sportify exists and sa login succeeds
        run: |
          echo "Verifying database sportify exists via sys.databases..."
          docker compose -f deploy/compose.yaml --profile with-db exec -T sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -C -b -U sa -P "TestPass1234!StrongSA" -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'sportify') THROW 50000, 'Database sportify does not exist', 1;"

          echo "Verifying sa login and DB_NAME() against database sportify..."
          DB_NAME="$(docker compose -f deploy/compose.yaml --profile with-db exec -T sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -C -b -U sa -P "TestPass1234!StrongSA" -d sportify -h -1 -W -Q "SET NOCOUNT ON; SELECT DB_NAME();" | head -n 1 | tr -d '\r\n ')"
          if [ "$DB_NAME" != "sportify" ]; then
            echo "Error: Expected DB_NAME to be 'sportify', got '$DB_NAME'"
            exit 1
          fi
          echo "Verified: DB_NAME() returned '$DB_NAME'"

      - name: Assert port 1433 is not published on host
        run: |
          CONTAINER_ID="$(docker compose -f deploy/compose.yaml --profile with-db ps -q sqlserver)"
          HOST_PORT="$(docker inspect "$CONTAINER_ID" --format '{{range $p, $conf := .NetworkSettings.Ports}}{{if eq $p "1433/tcp"}}{{range $conf}}{{.HostPort}}{{end}}{{end}}{{end}}')"
          if [ -n "$HOST_PORT" ]; then
            echo "Error: Port 1433 is mapped to host port: $HOST_PORT"
            exit 1
          fi
          PUBLISHED_PORT="$(docker compose -f deploy/compose.yaml --profile with-db port sqlserver 1433 2>/dev/null || true)"
          if [ -n "$PUBLISHED_PORT" ] && [ "$PUBLISHED_PORT" != ":0" ]; then
            echo "Error: Port 1433 is published on host: $PUBLISHED_PORT"
            exit 1
          fi
          echo "Verified: Port 1433 is not published on the host"

      - name: Assert db-init idempotency by running a second time
        run: |
          echo "Running db-init a second time to verify idempotency..."
          docker compose -f deploy/compose.yaml --profile with-db run --rm db-init
          echo "Verified: db-init second run completed successfully"

      - name: Assert non-sa DB_USERNAME causes backend connection failure
        run: |
          echo "Testing that non-sa DB_USERNAME causes backend startup failure with login error..."
          LOGS="$(docker compose -f deploy/compose.yaml run --rm -e DB_USERNAME=nonexistent_user backend 2>&1 || true)"
          echo "$LOGS"
          if echo "$LOGS" | grep -qi "Login failed for user 'nonexistent_user'"; then
            echo "Verified: Backend startup failed with expected SQL Server login failure message"
          else
            echo "Error: Expected 'Login failed for user' message in backend logs, but was not found"
            exit 1
          fi

      - name: Start backend service and wait for actuator health UP
        run: |
          echo "Starting backend service with IMAGE_TAG=ci and DB_USERNAME=sa..."
          docker compose -f deploy/compose.yaml --profile with-db up -d backend
          echo "Waiting for http://localhost:8080/actuator/health to report UP..."
          for i in $(seq 1 60); do
            STATUS="$(curl -s -f http://localhost:8080/actuator/health 2>/dev/null | grep -o '"status":"UP"' || true)"
            if [ "$STATUS" = '"status":"UP"' ]; then
              echo "Backend healthcheck reported UP after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Error: Backend health check timed out after 120s"
              docker compose -f deploy/compose.yaml logs backend
              exit 1
            fi
            sleep 2
          done

      - name: Assert Flyway migrations were applied to sportify database
        run: |
          echo "Counting migration files dynamically under backend/src/main/resources/db/migration..."
          EXPECTED_MIGRATIONS="$(find backend/src/main/resources/db/migration -type f -name 'V*.sql' | wc -l | tr -d ' ')"
          echo "Expected migration files count: $EXPECTED_MIGRATIONS"
          if [ -z "$EXPECTED_MIGRATIONS" ] || [ "$EXPECTED_MIGRATIONS" -le 0 ]; then
            echo "Error: Failed to find migration files under backend/src/main/resources/db/migration"
            exit 1
          fi

          TOTAL_ROWS="$(docker compose -f deploy/compose.yaml --profile with-db exec -T sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -C -b -U sa -P "TestPass1234!StrongSA" -d sportify -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM flyway_schema_history;" | head -n 1 | tr -d '\r\n ')"
          SUCCESS_ROWS="$(docker compose -f deploy/compose.yaml --profile with-db exec -T sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -C -b -U sa -P "TestPass1234!StrongSA" -d sportify -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1;" | head -n 1 | tr -d '\r\n ')"

          echo "Flyway total rows: $TOTAL_ROWS, success rows: $SUCCESS_ROWS"

          if [ "$TOTAL_ROWS" != "$EXPECTED_MIGRATIONS" ]; then
            echo "Error: Expected $EXPECTED_MIGRATIONS migrations in flyway_schema_history, but found $TOTAL_ROWS"
            exit 1
          fi

          if [ "$SUCCESS_ROWS" != "$EXPECTED_MIGRATIONS" ]; then
            echo "Error: Expected all $EXPECTED_MIGRATIONS migrations to have success = 1, but found $SUCCESS_ROWS"
            exit 1
          fi

          echo "Verified: Exactly $EXPECTED_MIGRATIONS migrations were applied with success = 1"

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml --profile with-db logs

      - name: Cleanup compose stack
        if: always()
        run: |
          docker compose -f deploy/compose.yaml --profile with-db down -v || true
          rm -f deploy/.env

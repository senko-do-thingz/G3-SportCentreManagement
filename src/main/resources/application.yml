server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: G3-SportCentreManagement

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sportify;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    locations: classpath:db/migration/identity

server:
  port: 8080

spring:
  application:
    name: G3-SportCentreManagement

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sportify;encrypt=false
    username: sa
    password: password
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
